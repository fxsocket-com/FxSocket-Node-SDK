name: publish

# Two paths, both using npm Trusted Publishing (OIDC — no long-lived tokens):
#   • Manual run (Actions ▸ publish ▸ "Run workflow")  -> dry run, publishes nothing
#   • Push a version tag, e.g.  git tag v0.6.0 && git push --tags  -> npm
on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm run test
      - run: npm run build
      - name: Pack
        run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: '*.tgz'

  dry-run:
    # Manual trigger only: proves the package would publish, without doing it.
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm publish --dry-run --access public

  npm:
    # Real release: only when a version tag was pushed.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write # required for trusted publishing / provenance
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - name: Publish
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
